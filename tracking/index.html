<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track a shipment | LogiSwift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<script src="../assets/config.js"></script>
<style>
  .track-wrap{max-width:820px;margin:0 auto;padding:clamp(34px,6vw,64px) 28px 90px;}
  .loading{padding:40px;text-align:center;color:var(--steel-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .error-box{padding:30px 26px;border:1px solid var(--manifest-line);background:var(--white);color:var(--steel);}
  .error-box strong{color:var(--ink);display:block;margin-bottom:6px;font-family:'Oswald',sans-serif;font-size:17px;}
   .track-search{
     display:flex;gap:10px;border:1px solid var(--manifest-line);border-radius:14px;
     background:var(--white);padding:8px;margin-bottom:36px;box-shadow:0 12px 30px rgba(23,36,43,0.05);
  }
  .track-search input{
    flex:1;border:none;background:transparent;padding:10px 12px;
    font-family:'IBM Plex Mono',monospace;font-size:15px;
  }
  .track-search input:focus{outline:none;}
  .track-search button{
    background:var(--orange);color:var(--white);border:none;
     min-height:44px;padding:0 22px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;
  }
  .record{
     border:1px solid var(--manifest-line);border-radius:16px;background:var(--white);overflow:hidden;
     box-shadow:0 14px 34px rgba(23,36,43,0.05);
  }
  .record-head{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:22px 26px;border-bottom:1px solid var(--manifest-line);
    flex-wrap:wrap;gap:12px;
  }
  .record-head .id{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--steel-soft);}
  .record-head h1{font-size:26px;margin-top:6px;}
  .status-pill{
    align-self:flex-start;
    background:var(--green);color:var(--white);
    font-size:12.5px;font-family:'IBM Plex Mono',monospace;
    padding:7px 14px;letter-spacing:0.4px;
  }
  .record-meta{
    display:grid;grid-template-columns:repeat(3,1fr);
    border-bottom:1px solid var(--manifest-line);
  }
  .record-meta div{padding:18px 26px;border-left:1px solid var(--manifest-line);}
  .record-meta div:first-child{border-left:none;}
  .record-meta label{display:block;font-size:11.5px;color:var(--steel-soft);font-family:'IBM Plex Mono',monospace;margin-bottom:6px;}
  .record-meta span{font-size:14.5px;color:var(--ink);}

  .timeline{padding:26px;}
  .t-item{
    display:grid;grid-template-columns:110px 24px 1fr;gap:0;
  }
  .t-item .when{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel-soft);padding-top:2px;}
  .t-item .rail{position:relative;display:flex;justify-content:center;}
  .t-item .dot{width:10px;height:10px;border-radius:50%;background:var(--manifest-line);margin-top:4px;z-index:1;}
  .t-item.done .dot{background:var(--green);}
  .t-item .line{position:absolute;top:14px;bottom:-22px;width:1px;background:var(--manifest-line);}
  .t-item:last-child .line{display:none;}
  .t-item .body{padding-bottom:26px;}
  .t-item h4{font-size:15px;margin:0;color:var(--ink);}
  .t-item.done h4{color:var(--ink);}
  .t-item:not(.done) h4{color:var(--steel-soft);}
  .t-item p{font-size:13px;color:var(--steel-soft);margin:5px 0 0;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--steel-soft);
    border:1px dashed var(--manifest-line);
  }
  @media (max-width:600px){
    .track-wrap{padding-left:18px;padding-right:18px;}
    .track-search{flex-direction:column;padding:10px;margin-bottom:26px;}
    .track-search input{min-height:46px;padding:10px 8px;}
    .track-search button{width:100%;}
    .record-head{padding:18px;}
    .record-head h1{font-size:23px;}
    .record-meta{grid-template-columns:1fr;}
    .record-meta div{padding:14px 18px;border-left:0;border-bottom:1px solid var(--manifest-line);}
    .record-meta div:last-child{border-bottom:0;}
    .timeline{padding:22px 16px;}
    .t-item{grid-template-columns:76px 18px minmax(0,1fr);}
    .t-item .body{padding-bottom:24px;}
    .t-item h4{font-size:14px;}
    .t-item p{font-size:12.5px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="LogiSwift home">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand-copy"><span class="brand-name">LogiSwift</span><span class="brand-meta">Global freight visibility</span></span>
    </a>
    <nav class="nav" id="site-nav" aria-label="Primary navigation">
      <a href="/#pipeline">Shipment stages</a>
      <a href="/about/">About</a>
      <a href="/tracking/">Track a shipment</a>
    </nav>
    <button class="menu-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation">
      <span class="menu-icon" aria-hidden="true"><span></span><span></span></span>
    </button>
  </div>
</div>

<div class="track-wrap">

  <div class="track-search">
    <input type="text" id="trackInput" placeholder="Enter tracking ID, e.g. LS-48213-XA" aria-label="Shipment ID" autocomplete="off">
    <button type="button" onclick="lookupShipment()">LOCATE</button>
  </div>

  <div id="result"><div class="empty">Enter a shipment ID above to see its record.</div></div>
</div>

<footer>
  <div class="wrap foot-row">
    <span>© <span id="yr"></span> LogiSwift Systems</span>
    <span><a href="/privacy/">Privacy</a> &nbsp;·&nbsp; <a href="/terms/">Terms</a></span>
  </div>
</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();
const API_BASE = window.CONSIGNMENT_CONFIG.apiBase;

// Real backend sequence — must match SHIPMENT_STATUSES in server.js exactly.
const STAGES = [
  'Manifest Created',
  'Sorting Hub Allocation',
  'Customs Clearing Arrays',
  'In Transit',
  'Port of Discharge Checkpoint',
  'Out for Delivery',
  'Delivered'
];
const STAGE_LABELS = {
  'Manifest Created': 'Manifest created',
  'Sorting Hub Allocation': 'Sorting hub allocation',
  'Customs Clearing Arrays': 'Customs clearing',
  'In Transit': 'In transit',
  'Port of Discharge Checkpoint': 'Port of discharge checkpoint',
  'Out for Delivery': 'Out for delivery',
  'Delivered': 'Delivered'
};

function fmtDate(iso){
  if(!iso) return 'Pending';
  const d = new Date(iso);
  if(isNaN(d)) return 'Pending';
  return d.toLocaleDateString('en-US',{month:'short',day:'2-digit'}) + ', ' +
         d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}

function buildTimeline(shipment){
  const currentIdx = STAGES.indexOf(shipment.status);
  return STAGES.map((stage, i) => {
    const done = currentIdx >= 0 && i <= currentIdx;
    const isCurrent = i === currentIdx;
    return {
      name: STAGE_LABELS[stage],
      done,
      when: done ? (isCurrent ? fmtDate(shipment.updated_at || shipment.created_at) : '—') : 'Pending',
      note: isCurrent ? (shipment.notes || shipment.location || 'Current stage') : (done ? 'Completed' : 'Awaiting this stage')
    };
  });
}

async function lookupShipment(){
  const raw = document.getElementById('trackInput').value.trim();
  const result = document.getElementById('result');
  if(!raw){
    result.innerHTML = '<div class="empty">Enter a shipment ID above to see its record.</div>';
    return;
  }
  result.innerHTML = '<div class="loading">LOOKING UP RECORD…</div>';
  try {
    const r = await fetch(`${API_BASE}/shipments/${encodeURIComponent(raw)}`);
    if (r.status === 404) {
      result.innerHTML = `<div class="error-box"><strong>No record found</strong>No shipment matches "${raw.toUpperCase()}". Double-check the ID and try again.</div>`;
      return;
    }
    if (!r.ok) throw new Error('Lookup failed');
    const shipment = await r.json();
    renderRecord(shipment);
  } catch (err) {
    result.innerHTML = `<div class="error-box"><strong>Tracking is temporarily unavailable</strong>Please try again in a moment.</div>`;
  }
}

function renderRecord(shipment){
  const result = document.getElementById('result');
  const stages = buildTimeline(shipment);
  const currentIdx = STAGES.indexOf(shipment.status);
  result.innerHTML = `
    <div class="record">
      <div class="record-head">
        <div>
          <div class="id mono">${shipment.shipmentId}</div>
          <h1>${STAGE_LABELS[shipment.status] || shipment.status}</h1>
        </div>
        <span class="status-pill">STAGE ${currentIdx + 1} OF ${STAGES.length}</span>
      </div>
      <div class="record-meta">
        <div><label>SENDER</label><span>${shipment.sender || '—'}</span></div>
        <div><label>RECEIVER</label><span>${shipment.receiver || '—'}</span></div>
        <div><label>EST. ARRIVAL</label><span>${shipment.eta || 'Not set'}</span></div>
      </div>
      <div class="timeline">
        ${stages.map(s => `
          <div class="t-item ${s.done ? 'done':''}">
            <div class="when">${s.when}</div>
            <div class="rail"><div class="dot"></div><div class="line"></div></div>
            <div class="body">
              <h4>${s.name}</h4>
              <p>${s.note}</p>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// Pre-fill from homepage search (?id=...) if present
(function initFromQuery(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(id){
    document.getElementById('trackInput').value = id;
    lookupShipment();
  }
})();
</script>
<script src="../site.js"></script>
</body>
</html>
