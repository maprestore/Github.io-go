<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track a shipment — Consignment Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .track-wrap{max-width:760px;margin:0 auto;padding:56px 28px 90px;}
  .track-search{
    display:flex;gap:10px;border:1px solid var(--manifest-line);
    background:var(--white);padding:8px;margin-bottom:36px;
  }
  .track-search input{
    flex:1;border:none;background:transparent;padding:10px 12px;
    font-family:'IBM Plex Mono',monospace;font-size:15px;
  }
  .track-search input:focus{outline:none;}
  .track-search button{
    background:var(--orange);color:var(--white);border:none;
    padding:0 22px;font-weight:600;font-size:14px;cursor:pointer;
  }
  .record{
    border:1px solid var(--manifest-line);background:var(--white);
  }
  .record-head{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:22px 26px;border-bottom:1px solid var(--manifest-line);
    flex-wrap:wrap;gap:12px;
  }
  .record-head .id{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--steel-soft);}
  .record-head h1{font-size:26px;margin-top:6px;}
  .status-pill{
    align-self:flex-start;
    background:var(--green);color:var(--white);
    font-size:12.5px;font-family:'IBM Plex Mono',monospace;
    padding:7px 14px;letter-spacing:0.4px;
  }
  .record-meta{
    display:grid;grid-template-columns:repeat(3,1fr);
    border-bottom:1px solid var(--manifest-line);
  }
  .record-meta div{padding:18px 26px;border-left:1px solid var(--manifest-line);}
  .record-meta div:first-child{border-left:none;}
  .record-meta label{display:block;font-size:11.5px;color:var(--steel-soft);font-family:'IBM Plex Mono',monospace;margin-bottom:6px;}
  .record-meta span{font-size:14.5px;color:var(--ink);}

  .timeline{padding:26px;}
  .t-item{
    display:grid;grid-template-columns:110px 24px 1fr;gap:0;
  }
  .t-item .when{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel-soft);padding-top:2px;}
  .t-item .rail{position:relative;display:flex;justify-content:center;}
  .t-item .dot{width:10px;height:10px;border-radius:50%;background:var(--manifest-line);margin-top:4px;z-index:1;}
  .t-item.done .dot{background:var(--green);}
  .t-item .line{position:absolute;top:14px;bottom:-22px;width:1px;background:var(--manifest-line);}
  .t-item:last-child .line{display:none;}
  .t-item .body{padding-bottom:26px;}
  .t-item h4{font-size:15px;margin:0;color:var(--ink);}
  .t-item.done h4{color:var(--ink);}
  .t-item:not(.done) h4{color:var(--steel-soft);}
  .t-item p{font-size:13px;color:var(--steel-soft);margin:5px 0 0;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--steel-soft);
    border:1px dashed var(--manifest-line);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="mark"></span>CONSIGNMENT&nbsp;OPS</div>
    <nav class="nav">
      <a href="index.html#pipeline">Shipment stages</a>
      <a href="about.html">About</a>
      <a href="tracking.html">Track a shipment</a>
    </nav>
    <a href="admin.html" class="btn btn-outline">Operator sign in</a>
  </div>
</div>

<div class="track-wrap">

  <div class="track-search">
    <input type="text" id="trackInput" placeholder="Enter shipment ID, e.g. CN-48213-XA" value="CN-48213-XA">
    <button onclick="renderRecord()">LOCATE</button>
  </div>

  <div id="result"></div>
</div>

<footer>
  <div class="wrap foot-row">
    <span>© <span id="yr"></span> Consignment Ops</span>
    <span><a href="privacy.html">Privacy</a> &nbsp;·&nbsp; <a href="terms.html">Terms</a></span>
  </div>
</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

// Demo record — in production this calls the backend API (see server.js)
// GET /api/shipments/:trackingId
const demoStages = [
  {name:"Manifest created", when:"Sep 04, 08:12", done:true, note:"Shipment logged, 1 parcel, 4.2kg"},
  {name:"Sorting hub allocation", when:"Sep 04, 19:40", done:true, note:"Assigned to Lagos regional hub"},
  {name:"Customs clearing", when:"Sep 06, 10:05", done:true, note:"Cleared, no inspection required"},
  {name:"In transit", when:"Sep 07, 02:30", done:true, note:"Departed regional hub"},
  {name:"Out for delivery", when:"Pending", done:false, note:"Awaiting local courier assignment"},
  {name:"Delivered", when:"Pending", done:false, note:"Awaiting confirmation"},
];

function renderRecord(){
  const id = document.getElementById('trackInput').value.trim();
  const result = document.getElementById('result');
  if(!id){
    result.innerHTML = '<div class="empty">Enter a shipment ID above to see its record.</div>';
    return;
  }
  result.innerHTML = `
    <div class="record">
      <div class="record-head">
        <div>
          <div class="id mono">${id.toUpperCase()}</div>
          <h1>In transit</h1>
        </div>
        <span class="status-pill">STAGE 4 OF 6</span>
      </div>
      <div class="record-meta">
        <div><label>ORIGIN</label><span>Lagos, NG</span></div>
        <div><label>DESTINATION</label><span>Accra, GH</span></div>
        <div><label>EST. ARRIVAL</label><span>Sep 09</span></div>
      </div>
      <div class="timeline">
        ${demoStages.map(s => `
          <div class="t-item ${s.done ? 'done':''}">
            <div class="when">${s.when}</div>
            <div class="rail"><div class="dot"></div><div class="line"></div></div>
            <div class="body">
              <h4>${s.name}</h4>
              <p>${s.note}</p>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
renderRecord();
</script>
</body>
</html>
